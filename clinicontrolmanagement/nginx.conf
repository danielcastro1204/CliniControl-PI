server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Compresión gzip — sin esto, los bundles de JS/CSS se sirven sin comprimir.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/xml
        image/svg+xml
        font/ttf
        font/otf;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache de assets estáticos (llevan hash en el nombre, son inmutables)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
