services:
  # ── PostgreSQL ─────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?Define DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:?Define DB_NAME in .env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Backend (Spring Boot API) ────────────────────────────────────
  backend:
    build:
      context: ./clinicontrolbackend
      dockerfile: Dockerfile.springboot
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DB_USER: ${DB_USER:?Define DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD in .env}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:?Define DB_NAME in .env}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
      PORT: ${PORT:-3000}
    depends_on:
      db:
        condition: service_healthy

  # ── Frontend (Vite + Nginx) ────────────────────────────────────
  frontend:
    build:
      context: ./clinicontrolmanagement
      args:
        VITE_API_URL: http://localhost:3000
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
