spring.application.name=clinicontrol-backend

# Server
server.port=${PORT:3000}

# Database
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:clinicontrol}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Batch inserts/updates instead of one round-trip per row (attentions with many
# consultas/procedimientos, bulk report queries, etc.)
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# SQL init (run migrations on startup)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/migration/001_initial_schema.sql,classpath:db/migration/002_add_indexes.sql
spring.sql.init.continue-on-error=true
spring.jpa.defer-datasource-initialization=true

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=7200000

# CORS — comma-separated list of allowed frontend origins
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:5173}

# Logging
logging.level.com.clinicontrol=INFO
